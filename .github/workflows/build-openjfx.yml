name: Build OpenJFX

on:
  workflow_dispatch
  push
    branches:
      - openjfxtest

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
      - name: Clone OpenJDK Mobile sources 
        run: |
          git clone https://github.com/openjdk/mobile.git
          cd openjdk
          patch -p1 <../openjdk-ext/src/jfx.patch
          echo "DONE"


